# Node attributes: each entry's own attributes attached to ITS node (node = entry),
# making the BioBTree API's /ws/filter (CEL over attributes) reproducible as Cypher
# WHERE on node properties. Keys are dataset-prefixed (entrez_symbol, ensembl_biotype)
# so a merged node (HGNC+Ensembl+NCBIGene) collects every namespace's attrs cleanly.
#
# mode: all      (default) every field -- scalars + scalar lists kept, one level of
#                nested dicts flattened (sequence.length -> uniprot_sequence_length);
#                lists-of-objects skipped (heavy/relational). Long text capped.
# mode: compact  only the dataset's conf compact_fields (the opt-in slim knob).
#
# dbSNP is NOT here -- its ~1.1B variants get attrs from tools/dbsnp_py/extract.py.
defaults:
  mode: all
exclude: []          # global field names dropped even in all-mode (none by default)

datasets:
  # core entities (merged gene node collects hgnc+ensembl+entrez attrs)
  hgnc: {}
  ensembl: {}
  entrez: {}
  uniprot: {exclude: [comments]}   # keep names/sequence; drop the long comment blob
  # chemicals / drugs
  chebi: {exclude: [definition]}
  chembl_molecule: {}
  hmdb: {}
  drugbank: {}
  lipidmaps: {}
  swisslipids: {}
  pubchem: {}
  gtopdb: {}
  # pathways / domains / structures
  reactome: {}
  interpro: {}
  corum: {}
  # organism / cells / phenotype hubs
  taxonomy: {}
  cellosaurus: {}
  # model-organism genes
  mgi: {}
  rgd: {}
  sgd: {}
  zfin: {}
  flybase: {}
  wormbase: {}
  xenbase: {}
