# Showcase: demonstrate the GIANT layers (dbSNP variants, PubChem bioactivity) on a
# small curated set, since they're excluded wholesale from the subgraph. The point is
# proof-by-recognizable-example -- a reviewer sees TP53's variants and EGFR's
# inhibitors, not 1B variants / 100M compounds.
#
# Built as a targeted extraction from the index (filtered to these), then merged into
# the subgraph at assemble -- INDEPENDENT of the billion-scale full dump.
#  - dbSNP showcase  : rs# variants of `genes` (variant -is_sequence_variant_of-> gene)
#  - PubChem showcase: compounds with bioactivity against `genes`' proteins, PLUS the
#                      `compounds` below and their connections (both gene- and
#                      compound-centric, as requested).
#
# Genes are by SYMBOL and compounds by NAME; the extractor resolves them to canonical
# ids via the index (so we don't hand-curate error-prone CURIEs here).

